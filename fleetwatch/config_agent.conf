# FleetWatcher AI — FixedIT Data Agent Base Config
# Upload this first and enable it before all other configs.

[agent]
  interval            = "${SYNC_INTERVAL_SECONDS:-10}s"
  flush_interval      = "${FLUSH_INTERVAL_SECONDS:-10}s"
  metric_batch_size   = 100
  metric_buffer_limit = 10000
  debug               = ${TELEGRAF_DEBUG:-false}
  omit_hostname       = false

[global_tags]
  app              = "fleetwatch"
  app_version      = "1.0.0"
  device_serial    = "${DEVICE_PROP_SERIAL:-unknown}"
  device_model     = "${DEVICE_PROP_MODEL:-unknown}"
  device_firmware  = "${DEVICE_PROP_FIRMWARE:-unknown}"
  device_arch      = "${DEVICE_PROP_ARCH:-unknown}"
  site             = "${SITE:-Axis Experience Center}"
  area             = "${AREA:-Zone 1}"
  region           = "${REGION:-}"
