# FleetWatcher AI — AOA Event Polling Input
# Polls the AXIS Object Analytics API on a short interval to capture
# detected events (motion, fence crossing, occupancy, tailgating).
# Works on any Axis camera with AOA installed (AXIS OS 10+).

[[inputs.exec]]
  name_override = "aoa_event"
  commands      = ["${HELPER_FILES_DIR}/poll_aoa.sh"]
  interval      = "${AOA_POLL_INTERVAL:-5s}"
  timeout       = "4s"
  data_format   = "json_v2"

  [[inputs.exec.json_v2]]
    [[inputs.exec.json_v2.object]]
      path             = "data.scenarios"
      timestamp_key    = ""
      timestamp_format = ""

    [[inputs.exec.json_v2.field]]
      path = "id"
      rename = "scenario_id"
      type = "int"

    [[inputs.exec.json_v2.field]]
      path = "name"
      rename = "scenario_name"
      type = "string"

    [[inputs.exec.json_v2.field]]
      path = "type"
      rename = "scenario_type"
      type = "string"

    [[inputs.exec.json_v2.field]]
      path = "alarmActive"
      rename = "alarm_active"
      type = "bool"

# ── Heartbeat: fires every 5 s to detect cleared scenes ──────
[[inputs.exec]]
  name_override = "fw_heartbeat"
  commands      = ["sh", "-c", "printf '{\"tick\":1}'"]
  interval      = "5s"
  timeout       = "2s"
  data_format   = "json_v2"
  [[inputs.exec.json_v2]]
    [[inputs.exec.json_v2.field]]
      path = "tick"
      type = "int"
