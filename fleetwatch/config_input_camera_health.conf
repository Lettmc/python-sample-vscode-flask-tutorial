# FleetWatcher AI — Camera Health Input
# Polls VAPIX basicdeviceinfo and system endpoints to track device health.
# Runs every 30s to keep the health dashboard current without overloading.

[[inputs.exec]]
  name_override = "fw_device_health"
  commands      = ["${HELPER_FILES_DIR}/health_check.sh"]
  interval      = "30s"
  timeout       = "8s"
  data_format   = "json_v2"

  [[inputs.exec.json_v2]]
    [[inputs.exec.json_v2.field]]
      path   = "cpu_load"
      type   = "float"

    [[inputs.exec.json_v2.field]]
      path   = "mem_used_pct"
      type   = "float"

    [[inputs.exec.json_v2.field]]
      path   = "sd_used_pct"
      type   = "float"

    [[inputs.exec.json_v2.field]]
      path   = "sd_total_mb"
      type   = "int"

    [[inputs.exec.json_v2.field]]
      path   = "sd_free_mb"
      type   = "int"

    [[inputs.exec.json_v2.field]]
      path   = "uptime_seconds"
      type   = "int"

    [[inputs.exec.json_v2.field]]
      path   = "temperature_celsius"
      type   = "float"

    [[inputs.exec.json_v2.field]]
      path   = "network_rx_bytes"
      type   = "int"

    [[inputs.exec.json_v2.field]]
      path   = "network_tx_bytes"
      type   = "int"

    [[inputs.exec.json_v2.field]]
      path   = "firmware_version"
      type   = "string"

    [[inputs.exec.json_v2.tag]]
      path   = "serial"

    [[inputs.exec.json_v2.tag]]
      path   = "model"
