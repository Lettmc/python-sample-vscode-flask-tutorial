# FleetWatcher AI — AXIS Scene Metadata Input
# Subscribes to the on-camera Scene Metadata stream via Message Broker.
# Requires AXIS OS 11.9+ and an AI-capable camera (ARTPEC-7/8/9, CV25).
# Provides: frame-by-frame object tracking, consolidated object info, snapshots.

[[inputs.execd]]
  name_override = "scene_metadata"
  command       = ["${HELPER_FILES_DIR}/scene_metadata_reader.sh"]
  signal        = "STDIN"
  restart_delay = "10s"
  data_format   = "json_v2"

  [[inputs.execd.json_v2]]
    [[inputs.execd.json_v2.object]]
      path        = "@this"
      timestamp_key    = "timestamp"
      timestamp_format = "unix_ms"

    [[inputs.execd.json_v2.field]]
      path = "objectId"
      type = "string"

    [[inputs.execd.json_v2.field]]
      path = "class"
      type = "string"

    [[inputs.execd.json_v2.field]]
      path = "confidence"
      type = "float"

    [[inputs.execd.json_v2.field]]
      path = "bboxX"
      type = "float"

    [[inputs.execd.json_v2.field]]
      path = "bboxY"
      type = "float"

    [[inputs.execd.json_v2.field]]
      path = "bboxWidth"
      type = "float"

    [[inputs.execd.json_v2.field]]
      path = "bboxHeight"
      type = "float"

    [[inputs.execd.json_v2.field]]
      path = "velocity"
      type = "float"

    [[inputs.execd.json_v2.tag]]
      path = "scenarioId"
      type = "string"
