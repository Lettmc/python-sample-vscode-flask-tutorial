# FleetWatcher AI — HTTPS Cloud Push Output
# Pushes classified events to your FleetWatcher cloud backend.
# Set FW_CLOUD_URL and FW_CLOUD_TOKEN in FixedIT Data Agent environment vars.
# Leave FW_CLOUD_URL empty to disable cloud push (local-only mode).

[[outputs.http]]
  namepass         = ["aoa_event", "scene_metadata"]
  url              = "${FW_CLOUD_URL:-}"
  method           = "POST"
  timeout          = "15s"
  data_format      = "json"
  use_batch_format = false
  metric_batch_size = 1

  [outputs.http.headers]
    Content-Type  = "application/json"
    Authorization = "Bearer ${FW_CLOUD_TOKEN:-}"
    X-Camera-ID   = "${DEVICE_PROP_SERIAL:-unknown}"
    X-App         = "FleetWatcher/1.0"

# Immediately trigger clip upload shell script when an ESCALATE event fires
[[outputs.exec]]
  namepass          = ["aoa_event"]
  tagpass           = {fw_level = ["ESCALATE", "CHALLENGE"]}
  command           = ["${HELPER_FILES_DIR}/clip_upload.sh"]
  data_format       = "json"
  use_batch_format  = false
  metric_batch_size = 1
  timeout           = "30s"
