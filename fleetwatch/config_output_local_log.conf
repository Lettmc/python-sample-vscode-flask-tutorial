# FleetWatcher AI — Local Log Output
# Writes all classified events to stdout (visible in FixedIT Logs tab).
# Keep this enabled for debugging; safe to disable in production to reduce noise.

[[outputs.file]]
  files             = ["stdout"]
  data_format       = "template"
  metric_batch_size = 1
  use_batch_format  = false

  # One line per event: LEVEL | scenario | objects | location
  data_template = '''[{{.Time.Format "2006-01-02 15:04:05"}}] {{if .Tags.fw_level}}[{{.Tags.fw_level}}]{{else}}[INFO]{{end}} measurement={{.Name}} scenario={{.Tags.scenario_name | default "-"}} objects={{.Fields.detected_objects | default "-"}} site={{.Tags.site | default "-"}}
'''

# Health metrics go to a separate log line (lower verbosity)
[[outputs.file]]
  namepass          = ["fw_device_health"]
  files             = ["stdout"]
  data_format       = "template"
  metric_batch_size = 1

  data_template = '''[{{.Time.Format "2006-01-02 15:04:05"}}] [HEALTH] model={{.Tags.model | default "-"}} serial={{.Tags.serial | default "-"}} cpu={{.Fields.cpu_load | default 0}}% mem={{.Fields.mem_used_pct | default 0}}% sd_free={{.Fields.sd_free_mb | default 0}}MB
'''
