# FleetWatcher AI — Event Classification Processor
# Runs Starlark logic to assign Observe / Challenge / Escalate levels
# to every AOA event and Scene Metadata detection.
# Enable AFTER config_input_aoa_events.conf and config_input_scene_metadata.conf.

[[processors.starlark]]
  namepass    = ["aoa_event", "scene_metadata"]
  script      = "${HELPER_FILES_DIR}/fleetwatch_logic.star"

# Tag enrichment: add site context to all FleetWatcher events
[[processors.enum]]
  namepass = ["aoa_event", "scene_metadata"]
  [[processors.enum.mapping]]
    tag    = "fw_level"
    dest   = "fw_priority_num"
    [processors.enum.mapping.value_mappings]
      "ESCALATE"  = "1"
      "CHALLENGE" = "2"
      "OBSERVE"   = "3"

# Deduplicate rapid repeat events (same scenario firing multiple times per second)
[[processors.dedup]]
  namepass    = ["aoa_event"]
  dedup_interval = "30s"
